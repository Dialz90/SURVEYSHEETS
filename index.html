<style>
  :root{
    --maroon:#E5171F;
    --maroon-dark:#A80E13;
    --maroon-tint:#FBE7E7;
    --ink:#1C1C1C;
    --paper:#F5F5F4;
    --card:#FFFFFF;
    --line:#DCDCDA;
    --muted:#6E6E6E;
    --success:#2F6F4E;
    --success-bg:#E3F0E8;
    --warn:#B06A22;
    --warn-bg:#F7ECDB;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:78px;
  }
  #shell{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;}
  h1,h2,h3{font-family:'Roboto Slab',serif;margin:0;}
  .mono{font-family:'Roboto Mono',monospace;}
  .header{
    background:var(--card);
    border-bottom:1px solid var(--line);
    padding:calc(14px + env(safe-area-inset-top)) 16px 12px;
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .brand-logo{height:34px;width:auto;display:block;}
  .brand-logo-lg{height:64px;width:auto;display:block;margin:0 auto;}
  .brand-sub{font-size:10.5px;color:var(--muted);letter-spacing:0.6px;text-transform:uppercase;margin-top:1px;}
  .surveyor-pill{
    display:flex;align-items:center;gap:7px;
    background:var(--maroon-tint);color:var(--maroon-dark);
    border:none;border-radius:20px;padding:7px 12px 7px 10px;
    font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
    cursor:pointer;white-space:nowrap;
  }
  .surveyor-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--maroon);flex:none;}
  .content{padding:16px 16px 24px;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .card-title{font-size:15px;font-weight:700;margin-bottom:10px;color:var(--ink);}
  .eyebrow{font-size:10.5px;letter-spacing:0.8px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px;}
  label.field-label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin:14px 0 6px;}
  label.field-label:first-child{margin-top:0;}
  input[type=text],input[type=email],input[type=tel],input[type=date],input[type=time],input[type=number],textarea,select{
    width:100%;
    border:none;
    border-bottom:1.5px dotted #C6C6C3;
    background:transparent;
    font-family:'Inter',sans-serif;
    font-size:16px;
    padding:8px 2px;
    color:var(--ink);
    outline:none;
  }
  select{-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237B8190' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 2px center;background-size:16px;padding-right:22px;}
  input:focus,textarea:focus,select:focus{border-bottom:1.5px solid var(--maroon);}
  textarea{resize:vertical;min-height:64px;line-height:1.5;font-family:'Inter',sans-serif;border:1.5px dotted #C6C6C3;border-radius:8px;padding:10px;}
  textarea:focus{border:1.5px solid var(--maroon);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;}
  .seg button{
    flex:1;padding:10px 8px;border:none;background:var(--card);
    font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;color:var(--muted);
    cursor:pointer;border-right:1px solid var(--line);
  }
  .seg button:last-child{border-right:none;}
  .seg button.active{background:var(--maroon);color:#fff;}
  .seg.completed button.active{background:var(--success);}
  .seg.notcompleted-active button:last-child.active{background:var(--warn);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    width:100%;padding:13px 16px;border-radius:10px;border:1.5px solid var(--maroon);
    background:var(--maroon);color:#fff;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;
    cursor:pointer;margin-top:4px;
  }
  .btn:active{transform:scale(0.98);}
  .btn.secondary{background:transparent;color:var(--maroon);}
  .btn.ghost{background:transparent;color:var(--muted);border-color:var(--line);}
  .btn.small{width:auto;padding:8px 14px;font-size:13px;}
  .btn.block-outline{background:transparent;color:var(--maroon);border:1.5px dashed var(--maroon);}
  .helper{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.2px;}
  .badge.instructed{background:var(--maroon-tint);color:var(--maroon-dark);}
  .badge.uninstructed{background:#EAEAEA;color:#555;}
  .badge.yes{background:var(--success-bg);color:var(--success);}
  .badge.no{background:var(--warn-bg);color:var(--warn);}
  .entry-row{
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:12px 0;border-bottom:1px dotted var(--line);cursor:pointer;
  }
  .entry-row:last-child{border-bottom:none;}
  .entry-row .l{flex:1;min-width:0;}
  .entry-row .job{font-weight:700;font-size:14px;}
  .entry-row .meta{font-size:12px;color:var(--muted);margin-top:3px;}
  .entry-row .r{text-align:right;flex:none;margin-left:10px;}
  .entry-row .hrs{font-family:'Roboto Mono',monospace;font-weight:600;font-size:14px;}
  .empty{
    text-align:center;padding:34px 18px;color:var(--muted);
  }
  .empty .big{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--card);border-top:1px solid var(--line);
    display:flex;max-width:520px;margin:0 auto;
    padding-bottom:env(safe-area-inset-bottom);
    z-index:30;
  }
  .nav-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:9px 4px 8px;background:none;border:none;color:var(--muted);
    font-family:'Inter',sans-serif;font-size:10.5px;font-weight:600;cursor:pointer;
  }
  .nav-btn.active{color:var(--maroon);}
  .nav-btn svg{width:21px;height:21px;}
  .surveyor-list button{
    width:100%;text-align:left;padding:14px 16px;border-radius:10px;border:1.5px solid var(--line);
    background:var(--card);font-family:'Inter',sans-serif;font-size:15.5px;font-weight:600;
    margin-bottom:9px;cursor:pointer;color:var(--ink);
  }
  .add-row{display:flex;gap:8px;margin-top:6px;}
  .add-row input{border:1.5px dotted #C6C6C3;border-radius:8px;padding:9px 10px;flex:1;}
  .sig-wrap{border:1.5px dashed #C6C6C3;border-radius:10px;padding:8px;background:#FAFAF9;margin-top:4px;}
  canvas#sigpad{width:100%;height:130px;display:block;touch-action:none;background:#fff;border-radius:6px;}
  .sig-actions{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
  .link-btn{background:none;border:none;color:var(--maroon);font-weight:600;font-size:12.5px;cursor:pointer;padding:4px;}
  .back{display:flex;align-items:center;gap:6px;color:var(--maroon);font-weight:600;font-size:13.5px;background:none;border:none;cursor:pointer;padding:0 0 12px;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:6px;}
  .detail-grid .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;font-weight:600;}
  .detail-grid .v{font-size:14.5px;margin-top:2px;}
  .divider{height:1px;background:var(--line);margin:14px 0;border:none;}
  .filters{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .filters select{border:1.5px solid var(--line);border-radius:8px;padding:9px 22px 9px 10px;font-size:16px;flex:1;min-width:110px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-grid.cal-weekdays{margin-bottom:4px;}
  .cal-weekday{text-align:center;font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;padding:2px 0;}
  .cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--paper);color:var(--ink);border:1.5px solid transparent;}
  .cal-day.pad{visibility:hidden;cursor:default;}
  .cal-day.today{border-color:var(--maroon);}
  .cal-day.selected{background:var(--maroon);color:#fff;}
  .cal-day .cal-hrs{font-size:9px;font-weight:700;font-family:'Roboto Mono',monospace;color:var(--maroon-dark);}
  .cal-day.selected .cal-hrs{color:#fff;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .stat .num{font-family:'Roboto Mono',monospace;font-size:20px;font-weight:600;}
  .stat .lbl{font-size:11px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.4px;}
  .loading{display:flex;align-items:center;justify-content:center;min-height:70vh;color:var(--muted);font-size:14px;}
  .toast{
    position:fixed;bottom:92px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;font-size:13.5px;
    z-index:50;opacity:0;pointer-events:none;transition:opacity 0.25s;
  }
  .toast.show{opacity:1;}
  .icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:11px;margin:-11px;display:inline-flex;align-items:center;justify-content:center;}
</style>
</head>
<body>
<div id="shell">
  <div id="app"><div class="loading">Loading Survey Sheets…</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){

var state = {
  surveyors: [],
  jobs: [],
  entries: [],
  currentSurveyor: null,

  repeatPrefill: null
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function brandMarkSVG(){

    '<rect x="0" y="0" width="100" height="100" rx="22" fill="#E5171F"/>' +

    '<path d="M31 47 L50 84 L69 47 Z" fill="#fff"/>' +

function brandLockup(iconPx, fontPx){
  return '<span style="display:inline-flex;align-items:center;gap:' + Math.round(iconPx*0.24) + 'px;">' +
    '<span style="width:' + iconPx + 'px;height:' + iconPx + 'px;flex:none;">' + brandMarkSVG() + '</span>' +
    '<span style="font-family:\'Roboto Slab\',serif;font-weight:700;font-size:' + fontPx + 'px;color:var(--maroon);letter-spacing:0.2px;">Survey Sheets</span>' +

}

async function sGet(key, shared){
  try{
    var raw = localStorage.getItem('surveysheets:' + key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function sSet(key, value, shared){
  try{ localStorage.setItem('surveysheets:' + key, JSON.stringify(value)); }
  catch(e){ console.error('storage set failed', key, e); }
}

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

function fmtDate(d){
  if(!d) return '';
  var parts = d.split('-');
  if(parts.length !== 3) return d;
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return parts[2] + ' ' + months[parseInt(parts[1],10)-1] + ' ' + parts[0];
}
function todayStr(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtTime(t){
  if(!t) return '—';
  var p = t.split(':'); var h = parseInt(p[0],10); var m = p[1];
  var ap = h >= 12 ? 'pm' : 'am';
  var h12 = h % 12; if(h12 === 0) h12 = 12;
  return h12 + ':' + m + ' ' + ap;
}
function nowHM(){
  var d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function elapsedSince(epoch){
  var ms = Date.now() - epoch;
  if(ms < 0) ms = 0;
  var totalSec = Math.floor(ms/1000);
  var h = Math.floor(totalSec/3600);
  var m = Math.floor((totalSec%3600)/60);
  var s = totalSec%60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function calcHours(onSite, offSite){
  if(!onSite || !offSite) return null;
  var a = onSite.split(':').map(Number), b = offSite.split(':').map(Number);
  var mins = (b[0]*60+b[1]) - (a[0]*60+a[1]);
  if(mins < 0) mins += 24*60;
  return Math.round((mins/60) * 100) / 100;
}
function fmtHours(h){
  if(h == null) return '—';
  return h.toFixed(2) + ' h';
}
function getJob(id){ return state.jobs.find(function(j){ return j.id === id; }); }
function isClosed(j){ return j && (j.status === 'closed' || j.status === 'invoiced'); }
function travelHours(e){ return (e.travelHours && !isNaN(e.travelHours)) ? Number(e.travelHours) : 0; }
function onSiteHours(e){ return calcHours(e.onSite, e.offSite) || 0; }
function totalHours(e){ return round2(onSiteHours(e) + travelHours(e)); }
function billableHours(e){
  // rounds up to the nearest 15 minutes (0.25h)
  var t = onSiteHours(e) + travelHours(e);
  return Math.ceil(t * 4) / 4;
}
function entryRate(e){
  var job = getJob(e.jobId);
  return (job && job.hourlyRate) ? Number(job.hourlyRate) : 0;
}
function entryDollars(e){ return round2(billableHours(e) * entryRate(e)); }
function locationLabel(e){
  if(e.location !== 'office') return 'Field';
  return e.officeType === 'wfh' ? 'Office (WFH)' : 'Office';
}
function fmtMoney(n){
  if(!n) return '$0.00';
  return '$' + n.toFixed(2);
}

async function init(){
  state.surveyors = (await sGet('surveyors')) || [];
  state.jobs = (await sGet('jobs')) || [];
  state.entries = (await sGet('entries')) || [];
  state.currentSurveyor = await sGet('currentSurveyor', false);
  state.activeSession = await sGet('activeSession', false);
  state.view = state.currentSurveyor ? 'home' : 'pickSurveyor';
  render();
}

function icon(name){
  var icons = {
    home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
    jobs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>',
    history:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
    chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>',
    chevLeft:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
    chevRight:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>'
  };
  return icons[name] || '';
}

var elapsedInterval = null;

function render(){
  if(elapsedInterval){ clearInterval(elapsedInterval); elapsedInterval = null; }
  var app = document.getElementById('app');
  var html = '';
  if(state.view === 'pickSurveyor'){
    html = renderPickSurveyor();
  } else {
    html = renderHeader() + '<div class="content">' + renderBody() + '</div>' + renderBottomNav();
  }
  app.innerHTML = html;
  postRender();
}

function renderHeader(){
  return '' +
  '<div class="header">' +
    '<div class="brand">' +
      '<div>' +
        brandLockup(30, 19) +
        '<div class="brand-sub">Work Instructions</div>' +
      '</div>' +
      '<button class="surveyor-pill" data-action="switchSurveyor"><span class="dot"></span>' + esc(state.currentSurveyor) + '</button>' +
    '</div>' +
  '</div>';
}

function renderBottomNav(){
  function b(v, ic, label){
    var active = state.view === v ? ' active' : '';
    return '<button class="nav-btn' + active + '" data-action="nav" data-view="' + v + '">' + icon(ic) + '<span>' + label + '</span></button>';
  }
  return '<div class="bottom-nav">' +
    b('home','home','Home') +
    b('newEntry','plus','New entry') +
    b('jobs','jobs','Jobs') +
    b('history','history','History') +
    '</div>';
}

function renderBody(){
  switch(state.view){
    case 'home': return renderHome();
    case 'jobs': return renderJobs();
    case 'newJob': return renderNewJob();
    case 'editJob': return renderEditJob();
    case 'newEntry': return renderNewEntry();
    case 'history': return renderHistory();
    case 'entryDetail': return renderEntryDetail();
    case 'editEntry': return renderEditEntry();
    default: return renderHome();
  }
}

// ---------- Pick surveyor ----------

  var list = state.surveyors.map(function(s){
    return '<button data-action="chooseSurveyor" data-name="' + esc(s) + '">' + esc(s) + '</button>';
  }).join('');
  return '' +
  '<div class="content" style="padding-top:calc(44px + env(safe-area-inset-top));">' +
    '<div style="text-align:center;margin-bottom:26px;">' +
      '<div style="display:flex;justify-content:center;">' + brandLockup(56, 26) + '</div>' +
      '<div class="brand-sub" style="margin-top:10px;">Work Instructions</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-title">Who\'s using the app?</div>' +
      '<div class="surveyor-list">' + (list || '<div class="helper">No surveyors added yet — add your name below.</div>') + '</div>' +
      '<div class="divider"></div>' +
      '<label class="field-label">Add a surveyor</label>' +
      '<div class="add-row">' +
        '<input type="text" id="newSurveyorName" placeholder="Full name">' +
        '<button class="btn small" data-action="addSurveyor">Add</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

// ---------- Home ----------
function renderHome(){
  var todaysEntries = state.entries.filter(function(e){ return e.date === todayStr() && e.surveyorName === state.currentSurveyor; });
  var todaysHours = todaysEntries.reduce(function(sum,e){ return sum + totalHours(e); }, 0);
  var weekEntries = state.entries.filter(function(e){ return e.surveyorName === state.currentSurveyor && isThisWeek(e.date); });
  var weekHours = weekEntries.reduce(function(sum,e){ return sum + totalHours(e); }, 0);
  var weekDollars = weekEntries.reduce(function(sum,e){ return sum + entryDollars(e); }, 0);
  var recent = state.entries.slice().sort(function(a,b){ return b.createdAt - a.createdAt; }).slice(0,6);

  var stats = '' +
    '<div class="stat-grid">' +
      '<div class="stat"><div class="num">' + todaysEntries.length + '</div><div class="lbl">Entries today</div></div>' +
      '<div class="stat"><div class="num">' + todaysHours.toFixed(1) + 'h</div><div class="lbl">Hours today</div></div>' +
      '<div class="stat"><div class="num">' + weekHours.toFixed(1) + 'h</div><div class="lbl">Hours this week</div></div>' +
      '<div class="stat"><div class="num">' + fmtMoney(weekDollars) + '</div><div class="lbl">Billable this week</div></div>' +
    '</div>';

  var recentHtml;
  if(recent.length === 0){
    recentHtml = '<div class="empty"><div class="big">No entries yet</div>Log your first work instruction to get started.</div>';
  } else {
    recentHtml = recent.map(entryRow).join('');
  }

  return '' +
    stats +
    '<button class="btn" data-action="nav" data-view="newEntry">' + icon('plus') + ' New work instruction</button>' +
    '<div class="card" style="margin-top:14px;">' +
      '<div class="card-title">Recent entries</div>' +
      recentHtml +
    '</div>';
}

function isThisWeek(dateStr){
  if(!dateStr) return false;
  var d = new Date(dateStr + 'T00:00:00');
  var now = new Date();
  var day = (now.getDay() + 6) % 7; // Mon=0
  var monday = new Date(now); monday.setDate(now.getDate() - day); monday.setHours(0,0,0,0);
  var sunday = new Date(monday); sunday.setDate(monday.getDate() + 7);
  return d >= monday && d < sunday;
}

function entryRow(e){
  var job = getJob(e.jobId);
  var badge = e.timeType === 'instructed'
    ? '<span class="badge instructed">Instructed</span>'
    : '<span class="badge uninstructed">Uninstructed</span>';
  var locBadge = e.location === 'office' ? (' <span class="badge uninstructed">' + (e.officeType === 'wfh' ? 'WFH' : 'Office') + '</span>') : '';
  var invBadge = e.invoiced ? ' <span class="badge yes">Invoiced</span>' : '';
  var travelNote = travelHours(e) > 0 ? (' <span class="meta" style="display:inline;">+ ' + travelHours(e).toFixed(1) + 'h travel</span>') : '';
  return '' +
    '<div class="entry-row" data-action="viewEntry" data-id="' + e.id + '">' +
      '<div class="l">' +
        '<div class="job">' + esc(job ? job.number : 'Unknown job') + ' · ' + esc(job ? job.name : '') + '</div>' +
        '<div class="meta">' + fmtDate(e.date) + ' · ' + esc(e.surveyorName) + '</div>' +
        '<div class="meta">' + badge + locBadge + invBadge + travelNote + '</div>' +
      '</div>' +
      '<div class="r">' +
        '<div class="hrs">' + fmtHours(totalHours(e)) + '</div>' +
      '</div>' +
    '</div>';
}

// ---------- Jobs ----------
function renderJobs(){
  var jobsSorted = state.jobs.slice().sort(function(a,b){
    var aInv = isClosed(a) ? 1 : 0, bInv = isClosed(b) ? 1 : 0;
    if(aInv !== bInv) return aInv - bInv;
    return b.createdAt - a.createdAt;
  });
  var list;
  if(jobsSorted.length === 0){
    list = '<div class="empty"><div class="big">No jobs yet</div>Create a job to start logging time against it.</div>';
  } else {
    list = jobsSorted.map(function(j){
      var jobEntries = state.entries.filter(function(e){ return e.jobId === j.id; });
      var count = jobEntries.length;
      var outstanding = jobEntries.filter(function(e){ return !e.invoiced; });
      var outstandingDollars = outstanding.reduce(function(sum,e){ return sum + entryDollars(e); }, 0);
      var outstandingHours = outstanding.reduce(function(sum,e){ return sum + totalHours(e); }, 0);
      var contactBits = [j.clientName, j.clientEmail, j.clientPhone].filter(Boolean);
      var contact = contactBits.join(' · ');
      var badges = isClosed(j) ? '<span class="badge no" style="margin-right:5px;">Closed</span>' : '';
      if(j.hourlyRate) badges += '<span class="badge uninstructed">' + fmtMoney(Number(j.hourlyRate)) + '/hr</span>';
      var outstandingNote = (outstanding.length > 0)
        ? ('<div class="meta" style="margin-top:4px;color:var(--maroon-dark);font-weight:600;">' + outstandingHours.toFixed(1) + 'h not yet invoiced' + (j.hourlyRate ? ' · ' + fmtMoney(round2(outstandingDollars)) : '') + '</div>')
        : '';
      return '' +
        '<div class="entry-row" data-action="editJob" data-id="' + j.id + '" style="' + (isClosed(j) ? 'opacity:0.6;' : '') + '">' +
          '<div class="l">' +
            '<div class="job">' + esc(j.number) + ' · ' + esc(j.name) + '</div>' +
            '<div class="meta">' + (contact ? esc(contact) : 'No client contact on file') + '</div>' +
            (badges ? '<div class="meta" style="margin-top:4px;">' + badges + '</div>' : '') +
            outstandingNote +
          '</div>' +
          '<div class="r" style="display:flex;align-items:center;gap:6px;"><div class="meta">' + count + ' ' + (count === 1 ? 'entry' : 'entries') + '</div><span style="width:16px;height:16px;color:var(--muted);display:flex;">' + icon('chev') + '</span></div>' +
        '</div>';
    }).join('');
  }
  return '' +
    '<button class="btn block-outline" data-action="nav" data-view="newJob">' + icon('plus') + ' New job</button>' +
    '<div class="card" style="margin-top:14px;">' +
      '<div class="card-title">All jobs</div>' +
      '<div class="helper" style="margin-bottom:2px;">Tap a job to edit its details, rate, status or client contact.</div>' +
      list +
    '</div>';
}

function renderJobForm(opts){
  opts = opts || {};
  var status = isClosed(opts) ? 'closed' : 'active';
  return '' +
    '<button class="back" data-action="nav" data-view="jobs">&larr; Jobs</button>' +
    '<div class="card">' +
      '<div class="card-title">' + (opts.editing ? 'Edit job' : 'New job') + '</div>' +
      '<label class="field-label">Job number</label>' +
      '<input type="text" id="jobNumber" placeholder="26/034" value="' + esc(opts.number || '') + '">' +
      '<label class="field-label">Job name</label>' +
      '<input type="text" id="jobName" placeholder="Smith Street subdivision" value="' + esc(opts.name || '') + '">' +
      '<label class="field-label">Billing rate ($/hr, optional)</label>' +
      '<input type="number" step="0.01" min="0" id="jobRate" placeholder="180.00" value="' + (opts.hourlyRate || '') + '">' +
      (opts.editing ? (
        '<label class="field-label">Job status</label>' +
        '<div class="seg" id="jobStatusSeg" data-value="' + status + '">' +
          '<button type="button" data-val="active" class="' + (status === 'active' ? 'active' : '') + '" data-action="setJobStatus">Active</button>' +
          '<button type="button" data-val="closed" class="' + (status === 'closed' ? 'active' : '') + '" data-action="setJobStatus">Closed</button>' +
        '</div>' +
        '<div class="helper">Closed jobs drop off the job picker when logging new time. Switch back to Active any time — even months later — to reopen and keep logging against it. Nothing is deleted either way.</div>'
      ) : '') +
      '<div class="divider"></div>' +
      '<div class="eyebrow">Client contact</div>' +
      '<label class="field-label">Client name (optional)</label>' +
      '<input type="text" id="jobClientName" placeholder="Jane Smith" value="' + esc(opts.clientName || '') + '">' +
      '<label class="field-label">Client email (optional)</label>' +
      '<input type="email" id="jobEmail" placeholder="client@example.com" value="' + esc(opts.clientEmail || '') + '">' +
      '<label class="field-label">Client phone (optional)</label>' +
      '<input type="tel" id="jobPhone" placeholder="0412 345 678" value="' + esc(opts.clientPhone || '') + '">' +
      (opts.editing
        ? '<button class="btn" style="margin-top:18px;" data-action="saveEditedJob" data-id="' + opts.id + '">Save changes</button>'
        : '<button class="btn" style="margin-top:18px;" data-action="saveJob">Create job</button>') +
    '</div>';
}

function renderNewJob(){
  return renderJobForm({ editing: false });
}

function renderBillingCard(j){
  var jobEntries = state.entries.filter(function(e){ return e.jobId === j.id; });
  var outstanding = jobEntries.filter(function(e){ return !e.invoiced; });
  var invoiced = jobEntries.filter(function(e){ return e.invoiced; });
  var outHours = outstanding.reduce(function(sum,e){ return sum + totalHours(e); }, 0);
  var outDollars = outstanding.reduce(function(sum,e){ return sum + entryDollars(e); }, 0);
  var invHours = invoiced.reduce(function(sum,e){ return sum + totalHours(e); }, 0);
  var invDollars = invoiced.reduce(function(sum,e){ return sum + entryDollars(e); }, 0);

  if(jobEntries.length === 0) return '';

  return '' +
    '<div class="card">' +
      '<div class="card-title">Billing</div>' +
      '<div class="detail-grid">' +
        '<div><div class="k">Not yet invoiced</div><div class="v">' + outHours.toFixed(2) + 'h' + (j.hourlyRate ? ' · ' + fmtMoney(round2(outDollars)) : '') + '</div></div>' +
        '<div><div class="k">Already invoiced</div><div class="v">' + invHours.toFixed(2) + 'h' + (j.hourlyRate ? ' · ' + fmtMoney(round2(invDollars)) : '') + '</div></div>' +
      '</div>' +
      (outstanding.length > 0
        ? ('<button class="btn secondary" style="margin-top:14px;" data-action="markJobInvoiced" data-id="' + j.id + '">Mark all ' + outstanding.length + ' outstanding ' + (outstanding.length === 1 ? 'entry' : 'entries') + ' as invoiced</button>' +
           '<div class="helper">Use this after you send an invoice covering the job so far. It only flags entries logged up to now — anything you add later stays outstanding for next time.</div>')
        : '<div class="helper">Everything logged against this job has been invoiced.</div>') +
    '</div>';
}

function renderEditJob(){
  var j = state.jobs.find(function(x){ return x.id === state.editJobId; });
  if(!j) return '<div class="empty">Job not found.</div>';
  return renderJobForm({
    editing: true,
    id: j.id,
    number: j.number,
    name: j.name,
    clientName: j.clientName,
    clientEmail: j.clientEmail,
    clientPhone: j.clientPhone,
    hourlyRate: j.hourlyRate,
    status: j.status || 'active'
  }) + renderBillingCard(j);
}

// ---------- New entry ----------
function renderNewEntry(){
  if(state.jobs.length === 0){
    return '' +
      '<div class="card">' +
        '<div class="card-title">No jobs yet</div>' +
        '<div class="helper">You need at least one job before logging a work instruction.</div>' +
        '<button class="btn" style="margin-top:14px;" data-action="nav" data-view="newJob">' + icon('plus') + ' Create a job</button>' +
      '</div>';
  }
  if(state.activeSession && state.activeSession.surveyorName === state.currentSurveyor){
    if(state.activeSession.status === 'running') return renderActiveSessionRunning();
    if(state.activeSession.status === 'stopped') return renderEntryForm({
      fromSession: true,
      date: state.activeSession.date,
      onSite: state.activeSession.onSiteTime,
      offSite: state.activeSession.offSiteTime,
      jobId: state.activeSession.jobId,
      timeType: state.activeSession.timeType
    });
  }
  if(state.entryMode === 'manual') return renderEntryForm({ fromSession: false, allowRepeat: true });
  return renderClockOnForm();
}

function pickableJobs(selectedId){
  return state.jobs.filter(function(j){ return !isClosed(j) || j.id === selectedId; });
}

function renderClockOnForm(){
  var prefill = state.repeatPrefill;
  var jobOptions = pickableJobs(prefill && prefill.jobId).slice().sort(function(a,b){return b.createdAt-a.createdAt;}).map(function(j){
    var sel = (prefill && prefill.jobId === j.id) ? ' selected' : '';
    return '<option value="' + j.id + '"' + sel + '>' + esc(j.number) + ' — ' + esc(j.name) + '</option>';
  }).join('');
  var tt = prefill ? prefill.timeType : 'uninstructed';
  var html = '' +
    '<div class="card">' +
      '<button type="button" class="link-btn" style="padding-left:0;margin-bottom:6px;" data-action="toggleEntryMode">Enter times manually instead &rarr;</button>' +
      '<div class="card-title">Clock on to a job</div>' +
      (state.entries.some(function(e){return e.surveyorName===state.currentSurveyor;}) ? '<button type="button" class="link-btn" style="padding-left:0;" data-action="repeatLast">Repeat my last entry\'s job &amp; type</button>' : '') +
      '<label class="field-label">Job</label>' +
      '<select id="clockJob">' + jobOptions + '</select>' +
      '<label class="field-label">Time type</label>' +
      '<div class="seg" id="clockTimeTypeSeg" data-value="' + tt + '">' +
        '<button type="button" data-val="uninstructed" class="' + (tt==='instructed' ? '' : 'active') + '" data-action="setClockTimeType">Uninstructed</button>' +

  state.repeatPrefill = null;
  return html;
}

function renderActiveSessionRunning(){

function renderEntryForm(opts){
  opts = opts || {};
  if(opts.allowRepeat && state.repeatPrefill){
    var rp = state.repeatPrefill;
    opts.jobId = opts.jobId || rp.jobId;
    opts.timeType = opts.timeType || rp.timeType;
    opts.taskRequested = opts.taskRequested || rp.taskRequested;
    state.repeatPrefill = null;
  }
  var jobOptions = pickableJobs(opts.jobId).slice().sort(function(a,b){return b.createdAt-a.createdAt;}).map(function(j){
    var sel = (opts.jobId && opts.jobId === j.id) ? ' selected' : '';
    return '<option value="' + j.id + '"' + sel + '>' + esc(j.number) + ' — ' + esc(j.name) + '</option>';
  }).join('');
  var timeType = opts.timeType || 'uninstructed';
  var instructedActive = timeType === 'instructed';
  var completed = opts.fullyCompleted || 'yes';

  var topLink = '';
  if(opts.fromSession){
    topLink = '<div class="helper" style="margin-bottom:10px;">Forgot to clock on or off at the right moment? Adjust the times below before saving.</div>';
  } else if(!opts.editing){
    topLink = '<button type="button" class="link-btn" style="padding-left:0;margin-bottom:6px;" data-action="toggleEntryMode">&larr; Back to clock on/off</button>' +
      (opts.allowRepeat && state.entries.some(function(e){return e.surveyorName===state.currentSurveyor;})
        ? '<button type="button" class="link-btn" style="padding-left:0;display:block;" data-action="repeatLastManual">Repeat my last entry</button>' : '');
  }

  return '' +
    '<div class="card">' +

      '<div class="card-title">' + (opts.editing ? 'Edit entry' : 'Work instruction') + '</div>' +
      '<label class="field-label">Surveyor</label>' +
      '<input type="text" value="' + esc(opts.surveyorName || state.currentSurveyor) + '" disabled style="opacity:0.7;">' +

      '<div class="row2">' +
        '<div><label class="field-label">Date</label><input type="date" id="entryDate" value="' + (opts.date || todayStr()) + '"></div>' +
        '<div><label class="field-label">Job</label><select id="entryJob">' + jobOptions + '</select></div>' +
      '</div>' +

      '<label class="field-label">Location</label>' +
      '<div class="seg" id="locationSeg" data-value="' + location + '">' +
        '<button type="button" data-val="field" class="' + (isOffice ? '' : 'active') + '" data-action="setLocation">Field</button>' +
        '<button type="button" data-val="office" class="' + (isOffice ? 'active' : '') + '" data-action="setLocation">Office</button>' +
      '</div>' +

      '<div id="officeTypeWrap" style="display:' + (isOffice ? 'block' : 'none') + ';margin-top:12px;">' +
        '<label class="field-label">Office time is</label>' +
        '<div class="seg" id="officeTypeSeg" data-value="' + officeType + '">' +
          '<button type="button" data-val="office" class="' + (officeType === 'wfh' ? '' : 'active') + '" data-action="setOfficeType">In office</button>' +
          '<button type="button" data-val="wfh" class="' + (officeType === 'wfh' ? 'active' : '') + '" data-action="setOfficeType">Work from home</button>' +
        '</div>' +
      '</div>' +

      '<div class="row2">' +
        '<div><label class="field-label">On site</label><input type="time" id="entryOnSite" value="' + (opts.onSite || '') + '"></div>' +
        '<div><label class="field-label">Off site</label><input type="time" id="entryOffSite" value="' + (opts.offSite || '') + '"></div>' +

        (opts.existingSignature ? ('<label class="field-label">Signature on file</label><div class="sig-wrap" style="margin-bottom:10px;"><img src="' + opts.existingSignature + '" style="width:100%;height:auto;display:block;"></div><div class="helper">Draw below to replace it, or leave blank to keep the signature on file.</div>') : '') +

// ---------- History ----------
function renderHistory(){
  var f = state.filters;
  var surveyorOptions = '<option value="all">All surveyors</option>' + state.surveyors.map(function(s){
    return '<option value="' + esc(s) + '"' + (f.surveyor===s?' selected':'') + '>' + esc(s) + '</option>';
  }).join('');
  var jobOptions = '<option value="all">All jobs</option>' + state.jobs.map(function(j){
    return '<option value="' + j.id + '"' + (f.job===j.id?' selected':'') + '>' + esc(j.number) + '</option>';
  }).join('');
  var invoicedOptions = '' +
    '<option value="all"' + (f.invoiced==='all'?' selected':'') + '>All</option>' +
    '<option value="outstanding"' + (f.invoiced==='outstanding'?' selected':'') + '>Not yet invoiced</option>' +
    '<option value="invoiced"' + (f.invoiced==='invoiced'?' selected':'') + '>Invoiced</option>';

  var toggle = '' +
    '<div class="seg" id="historyViewSeg" data-value="' + state.historyView + '" style="margin-bottom:12px;">' +
      '<button type="button" data-val="list" class="' + (state.historyView==='list'?'active':'') + '" data-action="setHistoryView">List</button>' +
      '<button type="button" data-val="calendar" class="' + (state.historyView==='calendar'?'active':'') + '" data-action="setHistoryView">Calendar</button>' +
    '</div>';

  var filtersRow = '' +
    '<div class="filters">' +
      '<select id="filterSurveyor" data-action="filterChange">' + surveyorOptions + '</select>' +
      '<select id="filterJob" data-action="filterChange">' + jobOptions + '</select>' +
      '<select id="filterInvoiced" data-action="filterChange">' + invoicedOptions + '</select>' +
    '</div>';

  return toggle + filtersRow + (state.historyView === 'calendar' ? renderCalendarView() : renderListView());
}

function renderListView(){
  var filtered = filteredEntries();
  var sumHours = filtered.reduce(function(sum,e){ return sum + totalHours(e); },0);
  var sumTravel = filtered.reduce(function(sum,e){ return sum + travelHours(e); },0);
  var sumDollars = filtered.reduce(function(sum,e){ return sum + entryDollars(e); },0);

  var list;
  if(filtered.length === 0){
    list = '<div class="empty"><div class="big">No entries match</div>Try adjusting your filters.</div>';
  } else {
    list = filtered.slice().sort(function(a,b){return b.createdAt-a.createdAt;}).map(entryRow).join('');
  }

  return '' +
    '<div class="stat-grid">' +
      '<div class="stat"><div class="num">' + filtered.length + '</div><div class="lbl">Entries</div></div>' +
      '<div class="stat"><div class="num">' + sumHours.toFixed(1) + 'h</div><div class="lbl">Total hours</div></div>' +
      '<div class="stat"><div class="num">' + sumTravel.toFixed(1) + 'h</div><div class="lbl">Travel hours</div></div>' +
      '<div class="stat"><div class="num">' + fmtMoney(sumDollars) + '</div><div class="lbl">Billable total</div></div>' +
    '</div>' +
    '<button class="btn secondary" data-action="exportExcel">Export to Excel</button>' +
    '<div class="card" style="margin-top:14px;">' +
      '<div class="card-title">Entries</div>' +
      list +
    '</div>';
}

function renderCalendarView(){
  var ym = state.calendarMonth || todayStr().slice(0,7);
  var year = parseInt(ym.slice(0,4),10), month = parseInt(ym.slice(5,7),10);
  var monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var daysInMonth = new Date(year, month, 0).getDate();
  var firstDow = (new Date(year, month-1, 1).getDay() + 6) % 7; // Monday = 0

  var filtered = filteredEntries();
  var byDate = {};
  filtered.forEach(function(e){
    if(!byDate[e.date]) byDate[e.date] = [];
    byDate[e.date].push(e);
  });

  var todayS = todayStr();
  var cells = '';
  for(var i=0;i<firstDow;i++){ cells += '<div class="cal-day pad"></div>'; }
  for(var d=1; d<=daysInMonth; d++){
    var dateStr = ym + '-' + String(d).padStart(2,'0');
    var dayEntries = byDate[dateStr] || [];
    var hrs = dayEntries.reduce(function(sum,e){ return sum + totalHours(e); }, 0);
    var cls = 'cal-day';
    if(dateStr === todayS) cls += ' today';
    if(dateStr === state.calendarSelectedDate) cls += ' selected';
    cells += '<div class="' + cls + '" data-action="calSelectDay" data-date="' + dateStr + '">' +
      '<span>' + d + '</span>' +
      (dayEntries.length > 0 ? '<span class="cal-hrs">' + hrs.toFixed(1) + 'h</span>' : '') +
      '</div>';
  }

  var weekdayHeaders = ['M','T','W','T','F','S','S'].map(function(w){ return '<div class="cal-weekday">' + w + '</div>'; }).join('');

  var dayDetail = '';
  if(state.calendarSelectedDate){
    var selEntries = (byDate[state.calendarSelectedDate] || []).sort(function(a,b){ return (a.onSite||'').localeCompare(b.onSite||''); });
    var selHours = selEntries.reduce(function(sum,e){ return sum + totalHours(e); }, 0);
    dayDetail = '' +
      '<div class="card" style="margin-top:14px;">' +
        '<div class="card-title">' + fmtDate(state.calendarSelectedDate) + '</div>' +
        (selEntries.length > 0
          ? ('<div class="helper" style="margin-bottom:4px;">' + selEntries.length + ' ' + (selEntries.length===1?'entry':'entries') + ' · ' + selHours.toFixed(1) + 'h</div>' + selEntries.map(entryRow).join(''))
          : '<div class="empty" style="padding:20px 0;">Nothing logged this day.</div>') +
      '</div>';
  }

  return '' +
    '<div class="card">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">' +
        '<button type="button" class="icon-btn" data-action="calPrevMonth">' + icon('chevLeft') + '</button>' +
        '<div class="card-title" style="margin:0;">' + monthNames[month-1] + ' ' + year + '</div>' +
        '<button type="button" class="icon-btn" data-action="calNextMonth">' + icon('chevRight') + '</button>' +
      '</div>' +
      '<div class="cal-grid cal-weekdays">' + weekdayHeaders + '</div>' +
      '<div class="cal-grid">' + cells + '</div>' +
      '<div class="helper" style="margin-top:10px;">Tap a day to see what was logged.</div>' +
    '</div>' +
    dayDetail;
}

function filteredEntries(){
  var f = state.filters;
  return state.entries.filter(function(e){
    if(f.surveyor !== 'all' && e.surveyorName !== f.surveyor) return false;
    if(f.job !== 'all' && e.jobId !== f.job) return false;
    if(f.invoiced === 'outstanding' && e.invoiced) return false;
    if(f.invoiced === 'invoiced' && !e.invoiced) return false;
    return true;
  });
}

          '</button>' +

        '<div><div class="k">Total hours</div><div class="v">' + fmtHours(totalHours(e)) + '</div></div>' +

      (e.notes ? ('<div class="eyebrow" style="margin-top:12px;">Notes</div><div class="v" style="white-space:pre-wrap;">' + esc(e.notes) + '</div>') : '') +
      '<div class="divider"></div>' +
      '<button type="button" class="btn ghost" data-action="toggleEntryInvoiced" data-id="' + e.id + '">' + (e.invoiced ? 'Mark as not yet invoiced' : 'Mark this entry as invoiced') + '</button>' +
      sig +
    '</div>';
}

// ---------- Post render (event wiring) ----------
var sigCtx = null, sigDrawing = false, sigLast = null;

function postRender(){
  var app = document.getElementById('app');
  app.onclick = handleClick;
  app.onchange = handleChange;

  if(state.view === 'newEntry'){
    if(state.activeSession && state.activeSession.status === 'running' && state.activeSession.surveyorName === state.currentSurveyor){
      elapsedInterval = setInterval(function(){
        var el = document.getElementById('elapsedTimer');
        if(el && state.activeSession) el.textContent = elapsedSince(state.activeSession.onSiteEpoch);
      }, 1000);
    } else {
      setupSignaturePad();
    }
  }
  if(state.view === 'editEntry'){
    setupSignaturePad();
  }
}

function handleChange(ev){
  var t = ev.target;
  if(t.id === 'filterSurveyor'){ state.filters.surveyor = t.value; render(); }
  if(t.id === 'filterJob'){ state.filters.job = t.value; render(); }
  if(t.id === 'filterInvoiced'){ state.filters.invoiced = t.value; render(); }
}

function handleClick(ev){
  var el = ev.target.closest('[data-action]');
  if(!el) return;
  var action = el.getAttribute('data-action');

  if(action === 'nav'){ state.view = el.getAttribute('data-view'); render(); }
  else if(action === 'switchSurveyor'){ state.view = 'pickSurveyor'; render(); }
  else if(action === 'chooseSurveyor'){ chooseSurveyor(el.getAttribute('data-name')); }
  else if(action === 'addSurveyor'){ addSurveyor(); }
  else if(action === 'saveJob'){ saveJob(); }

function shiftCalendarMonth(delta){
  var ym = state.calendarMonth || todayStr().slice(0,7);
  var year = parseInt(ym.slice(0,4),10), month = parseInt(ym.slice(5,7),10);
  month += delta;
  if(month < 1){ month = 12; year -= 1; }
  if(month > 12){ month = 1; year += 1; }
  state.calendarMonth = year + '-' + String(month).padStart(2,'0');
  render();
}

function setupSignaturePad(){
  var canvas = document.getElementById('sigpad');
  if(!canvas) return;
  var rect = canvas.getBoundingClientRect();
  if(rect.width === 0) return;
  var dpr = window.devicePixelRatio || 1;
  if(!canvas._sized || canvas._lastWidth !== rect.width){
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    sigCtx = canvas.getContext('2d');
    sigCtx.scale(dpr, dpr);
    sigCtx.strokeStyle = '#20242E';
    sigCtx.lineWidth = 2;
    sigCtx.lineCap = 'round';
    sigCtx.lineJoin = 'round';
    canvas._sized = true;
    canvas._lastWidth = rect.width;
    state.sigHasDrawn = false;
  }
  if(canvas._wired) return;
  canvas._wired = true;

  function pos(ev){
    var r = canvas.getBoundingClientRect();
    var x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    var y = (ev.touches ? ev.touches[0].clientY : ev.clientY) - r.top;
    return { x: x, y: y };
  }
  function start(ev){
    ev.preventDefault();
    sigDrawing = true;
    sigLast = pos(ev);
  }
  function move(ev){
    if(!sigDrawing) return;
    ev.preventDefault();
    var p = pos(ev);
    sigCtx.beginPath();
    sigCtx.moveTo(sigLast.x, sigLast.y);
    sigCtx.lineTo(p.x, p.y);
    sigCtx.stroke();
    sigLast = p;
    state.sigHasDrawn = true;
  }
  function end(){ sigDrawing = false; }

  canvas.addEventListener('pointerdown', start);
  canvas.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}

function clearSig(){
  var canvas = document.getElementById('sigpad');
  if(!canvas || !sigCtx) return;
  sigCtx.clearRect(0,0,canvas.width,canvas.height);
  state.sigHasDrawn = false;
}

async function saveEntry(){
  var jobId = document.getElementById('entryJob').value;
  var date = document.getElementById('entryDate').value;
  var location = document.getElementById('locationSeg').getAttribute('data-value') || 'field';
  var officeType = location === 'office' ? (document.getElementById('officeTypeSeg').getAttribute('data-value') || 'office') : null;
  var onSite = document.getElementById('entryOnSite').value;
  var offSite = document.getElementById('entryOffSite').value;
  var travel = location === 'office' ? 0 : parseFloat(document.getElementById('entryTravel').value);
  var timeType = document.getElementById('timeTypeSeg').getAttribute('data-value') || 'uninstructed';
  var task = (document.getElementById('entryTask').value || '').trim();
  var completed = document.getElementById('completedSeg').getAttribute('data-value') || 'yes';
  var reason = completed === 'no' ? (document.getElementById('entryReason').value || '').trim() : '';
  var notes = (document.getElementById('entryNotes').value || '').trim();

  if(!jobId || !date || !onSite || !offSite || !task){
    showToast('Please fill in job, date, times and the task requested');
    return;
  }
  if(completed === 'no' && !reason){
    showToast('Add a reason the task was not completed');
    return;
  }

  var signature = null, clientName = '', clientPosition = '';
  if(timeType === 'instructed'){
    clientName = (document.getElementById('clientName').value || '').trim();
    clientPosition = (document.getElementById('clientPosition').value || '').trim();
    if(!state.sigHasDrawn || !clientName){
      showToast('Instructed time needs a client signature and name');
      return;
    }
    var canvas = document.getElementById('sigpad');
    signature = canvas.toDataURL('image/png');
  }

  var entry = {
    id: uid(),
    surveyorName: state.currentSurveyor,
    jobId: jobId,
    date: date,
    location: location,
    officeType: officeType,
    onSite: onSite,
    offSite: offSite,
    travelHours: isNaN(travel) ? 0 : travel,
    timeType: timeType,
    taskRequested: task,
    fullyCompleted: completed,
    reasonNotCompleted: reason,
    signature: signature,
    clientName: clientName,
    clientPosition: clientPosition,
    notes: notes,
    createdAt: Date.now()
  };
  state.entries.push(entry);
  await sSet('entries', state.entries, true);
  if(state.activeSession){
    state.activeSession = null;
    await sSet('activeSession', null, false);
  }
  state.entryMode = 'clock';
  if(entry.timeType === 'instructed' && entry.signature){
    showToast('Entry saved — signed copy ready to send');
    state.detailId = entry.id;
    state.view = 'entryDetail';
  } else {
    showToast('Entry saved');
    state.view = 'home';
  }
  render();
}

function exportExcel(){
  var filtered = filteredEntries();
  if(filtered.length === 0){ showToast('No entries to export'); return; }

  var entryHeader = ['Date','Surveyor','Job No','Job Name','Client Name','Client Email','Client Phone','Rate ($/hr)','Location','On Site','Off Site','On-site Hours','Travel Hours','Total Hours','Billable Hours','Amount ($)','Invoiced','Time Type','Task Requested','Fully Completed','Reason Not Completed','Client Signatory','Client Position','Signed','Notes','Logged At'];
  var entryRows = filtered.slice().sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); }).map(function(e){
    var job = getJob(e.jobId) || {};
    return [
      e.date, e.surveyorName, job.number||'', job.name||'', job.clientName||'', job.clientEmail||'', job.clientPhone||'',
      job.hourlyRate || '', locationLabel(e), e.onSite, e.offSite, onSiteHours(e), travelHours(e), totalHours(e), billableHours(e), entryDollars(e),
      e.invoiced ? 'Yes' : 'No',
      e.timeType === 'instructed' ? 'Instructed' : 'Uninstructed',
      e.taskRequested, e.fullyCompleted === 'yes' ? 'Yes' : 'No', e.reasonNotCompleted||'',
      e.clientName||'', e.clientPosition||'', e.signature ? 'Yes' : 'No', e.notes||'',
      new Date(e.createdAt).toLocaleString()
    ];
  });

  var bySurveyor = {};
  filtered.forEach(function(e){
    var k = e.surveyorName;
    if(!bySurveyor[k]) bySurveyor[k] = { entries:0, instructed:0, uninstructed:0, travel:0, dollars:0 };
    var h = onSiteHours(e);
    bySurveyor[k].entries++;
    if(e.timeType === 'instructed') bySurveyor[k].instructed += h; else bySurveyor[k].uninstructed += h;
    bySurveyor[k].travel += travelHours(e);
    bySurveyor[k].dollars += entryDollars(e);
  });
  var surveyorHeader = ['Surveyor','Entries','Instructed Hours','Uninstructed Hours','Travel Hours','Total Hours','Billable ($)'];
  var surveyorRows = Object.keys(bySurveyor).sort().map(function(k){
    var s = bySurveyor[k];
    return [k, s.entries, round2(s.instructed), round2(s.uninstructed), round2(s.travel), round2(s.instructed+s.uninstructed+s.travel), round2(s.dollars)];
  });

  var byJob = {};
  filtered.forEach(function(e){
    var job = getJob(e.jobId);
    var k = e.jobId;
    if(!byJob[k]) byJob[k] = { number: job?job.number:'Unknown', name: job?job.name:'', entries:0, instructed:0, uninstructed:0, travel:0, dollars:0, outstandingDollars:0 };
    var h = onSiteHours(e);
    byJob[k].entries++;
    if(e.timeType === 'instructed') byJob[k].instructed += h; else byJob[k].uninstructed += h;
    byJob[k].travel += travelHours(e);
    byJob[k].dollars += entryDollars(e);
    if(!e.invoiced) byJob[k].outstandingDollars += entryDollars(e);
  });
  var jobHeader = ['Job No','Job Name','Entries','Instructed Hours','Uninstructed Hours','Travel Hours','Total Hours','Billable ($)','Not Yet Invoiced ($)'];
  var jobRows = Object.keys(byJob).map(function(k){
    var j = byJob[k];
    return [j.number, j.name, j.entries, round2(j.instructed), round2(j.uninstructed), round2(j.travel), round2(j.instructed+j.uninstructed+j.travel), round2(j.dollars), round2(j.outstandingDollars)];
  });

  var wb = XLSX.utils.book_new();
  var ws1 = XLSX.utils.aoa_to_sheet([entryHeader].concat(entryRows));
  var ws2 = XLSX.utils.aoa_to_sheet([surveyorHeader].concat(surveyorRows));
  var ws3 = XLSX.utils.aoa_to_sheet([jobHeader].concat(jobRows));
  XLSX.utils.book_append_sheet(wb, ws1, 'Entries');
  XLSX.utils.book_append_sheet(wb, ws2, 'By Surveyor');
  XLSX.utils.book_append_sheet(wb, ws3, 'By Job');

  var filename = 'SurveySheets_Work_Instructions_' + todayStr() + '.xlsx';
  XLSX.writeFile(wb, filename);
  showToast('Excel report downloaded');
}

function round2(n){ return Math.round(n*100)/100; }

// ---------- Signed PDF generation & sending ----------
function buildEntryPdf(e){
  var job = getJob(e.jobId) || {};
  var jsPDFCtor = window.jspdf.jsPDF;
  var doc = new jsPDFCtor({ unit: 'pt', format: 'a4' });
  var pageW = doc.internal.pageSize.getWidth();
  var margin = 48;
  var y = margin;
  var brandRed = [229,23,31];

  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(brandRed[0],brandRed[1],brandRed[2]);
  doc.text('SURVEY SHEETS', margin, y); y += 20;
  doc.setFontSize(10); doc.setFont('helvetica','normal'); doc.setTextColor(90,90,90);
  doc.text('Field Time & Work Instructions', margin, y); y += 22;

  doc.setDrawColor(210,205,195); doc.line(margin, y, pageW-margin, y); y += 22;

  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(30,30,30);
  doc.text('Work Instruction — Signed Confirmation', margin, y); y += 20;

  function row(label, value){
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(120,120,120);
    doc.text(label.toUpperCase(), margin, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(30,30,30);
    doc.text(String(value || '—'), margin + 130, y);
    y += 18;
  }
  row('Job number', job.number);
  row('Job name', job.name);
  row('Surveyor', e.surveyorName);
  row('Date', fmtDate(e.date));
  row('Location', locationLabel(e));
  row('On site', fmtTime(e.onSite));
  row('Off site', fmtTime(e.offSite));
  row('On-site hours', fmtHours(onSiteHours(e)));
  if(travelHours(e) > 0) row('Travel hours', fmtHours(travelHours(e)));
  row('Total hours', fmtHours(totalHours(e)));
  row('Fully completed', e.fullyCompleted === 'yes' ? 'Yes' : 'No');
  if(e.fullyCompleted === 'no') row('Reason not completed', e.reasonNotCompleted);
  y += 6;

  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(120,120,120);
  doc.text('SURVEY TASK REQUESTED', margin, y); y += 14;
  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(30,30,30);
  var taskLines = doc.splitTextToSize(e.taskRequested || '—', pageW - margin*2);
  doc.text(taskLines, margin, y); y += taskLines.length * 14 + 10;

  if(e.notes){
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(120,120,120);
    doc.text('NOTES', margin, y); y += 14;
    doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(30,30,30);
    var noteLines = doc.splitTextToSize(e.notes, pageW - margin*2);
    doc.text(noteLines, margin, y); y += noteLines.length * 14 + 10;
  }

  y += 10;
  doc.setDrawColor(210,205,195); doc.line(margin, y, pageW-margin, y); y += 22;
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(30,30,30);
  doc.text('Client representative sign-off', margin, y); y += 16;

  if(e.signature){
    try{ doc.addImage(e.signature, 'PNG', margin, y, 220, 80); }catch(err){}
  }
  y += 90;
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90,90,90);
  doc.text('Signed: ' + (e.clientName || '—'), margin, y); y += 14;
  doc.text('Position: ' + (e.clientPosition || '—'), margin, y); y += 14;

  return doc;
}

function pdfFilename(e){
  var job = getJob(e.jobId) || {};
  var safe = (job.number || 'job').replace(/[^a-z0-9]+/gi,'_');
  return 'SurveySheets_' + safe + '_' + e.date + '.pdf';
}

async function sendSignedPdf(id){
  var e = state.entries.find(function(x){ return x.id === id; });
  if(!e) return;
  var job = getJob(e.jobId);
  var doc = buildEntryPdf(e);
  var filename = pdfFilename(e);
  var subject = 'Signed work instruction — ' + (job ? job.number + ' ' + job.name : '');
  var greeting = job && job.clientName ? ('Hi ' + job.clientName.split(' ')[0] + ',') : 'Hi,';
  var body = greeting + '\n\nPlease find attached the signed work instruction for ' + (job ? job.number + ' — ' + job.name : 'your job') + ', completed on ' + fmtDate(e.date) + '.\n\nRegards,\n' + e.surveyorName;

  var canShareFiles = false;
  try{
    var blob = doc.output('blob');
    var file = new File([blob], filename, { type: 'application/pdf' });
    canShareFiles = navigator.canShare && navigator.canShare({ files: [file] });
    if(canShareFiles){
      await navigator.share({ files: [file], title: subject, text: body });
      showToast('Share sheet opened');
      return;
    }
  }catch(err){ /* fall through to download + mailto */ }

  doc.save(filename);
  var mailto = 'mailto:' + (job && job.clientEmail ? encodeURIComponent(job.clientEmail) : '') +
    '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body + '\n\n(Attach the PDF just downloaded to this email before sending.)');
  window.location.href = mailto;
  showToast('PDF downloaded — attach it to the email that just opened');
}

function downloadSignedPdf(id){
  var e = state.entries.find(function(x){ return x.id === id; });
  if(!e) return;
  var doc = buildEntryPdf(e);
  doc.save(pdfFilename(e));
}

init();
})();
</script>
</body>
